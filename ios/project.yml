name: ULTRON
options:
  bundleIdPrefix: com.ultron
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ULTRON:
    type: application
    platform: iOS
    sources:
      - path: ULTRON
      - path: Shared/ULTRONTaskActivityAttributes.swift
    info:
      path: ULTRON/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "ULTRON utilise le microphone pour transcrire tes messages avec Voxtral."
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultron.mobile
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        DEVELOPMENT_TEAM: 8M5UCCN46W
    dependencies:
      - target: ULTRONLiveActivity
  ULTRONLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ULTRONLiveActivity
      - path: Shared/ULTRONTaskActivityAttributes.swift
    info:
      path: ULTRONLiveActivity/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultron.mobile.liveactivity
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 8M5UCCN46W
